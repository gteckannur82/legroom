<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The Legroom sofa — room to stretch out — drawn from the same geometry as
    the macOS icon (app-macos/Icon/make-icon.swift), on a flatter Windows
    plate: larger, no drop shadow, and a hairline edge so the cream still
    reads on a light taskbar. `cargo run -p make-icon` renders every size.
  -->
  <rect x="40" y="40" width="944" height="944" rx="204" fill="#faf6ec" stroke="#d9d0bb" stroke-width="10"/>
  <g transform="translate(512 520) scale(0.93) translate(-512 -512)">
    <!-- Stroke every part double-width, then fill them all: the fills cover
         the inner half of each stroke, so the parts merge into one outline. -->
    <g fill="none" stroke="#3d3d42" stroke-width="88">
      <rect x="292" y="262" width="440" height="380" rx="110"/>
      <rect x="222" y="470" width="130" height="312" rx="64"/>
      <rect x="672" y="470" width="130" height="312" rx="64"/>
      <rect x="222" y="600" width="580" height="182" rx="64"/>
    </g>
    <g fill="#faf6ec">
      <rect x="292" y="262" width="440" height="380" rx="110"/>
      <rect x="222" y="470" width="130" height="312" rx="64"/>
      <rect x="672" y="470" width="130" height="312" rx="64"/>
      <rect x="222" y="600" width="580" height="182" rx="64"/>
    </g>
    <line x1="352" y1="612" x2="672" y2="612" stroke="#3d3d42" stroke-width="35.2" stroke-linecap="round"/>
    <rect x="310" y="316" width="404" height="244" rx="70" fill="#f6bf00"/>
    <rect x="238" y="783" width="64" height="58" rx="12" fill="#3d3d42"/>
    <rect x="722" y="783" width="64" height="58" rx="12" fill="#3d3d42"/>
  </g>
</svg>
